# DRAFT F-Droid build recipe for RSSReels.
#
# This file is not used by the app. Submit it as
# metadata/com.mossyisme.rssreels.yml in a merge request to
# https://gitlab.com/fdroid/fdroiddata — the F-Droid maintainers review
# and usually adjust React Native recipes before merging.
#
# Store listing text (title, descriptions, changelogs, icon) is read from
# fastlane/metadata/android in this repo, so it isn't repeated here.

Categories:
  - Reading
License: GPL-3.0-only
AuthorName: mossyisme
WebSite: https://moss.id.au
SourceCode: https://github.com/mossy-isme/RSSReels
IssueTracker: https://github.com/mossy-isme/RSSReels/issues

AutoName: RSSReels

RepoType: git
Repo: https://github.com/mossy-isme/RSSReels.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    sudo:
      - apt-get update
      - apt-get install -y xz-utils
      # React Native 0.88 needs Node >= 22.13; Debian's nodejs is older.
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz
      - echo "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - npm ci
      # FDROID=1 disables EAS Update (see app.config.ts).
      - FDROID=1 npx expo prebuild --platform android --no-install --clean
    scanignore:
      - node_modules
    build:
      - cd android
      - gradle assembleRelease

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([\d.]+)"
CurrentVersion: 1.0.0
CurrentVersionCode: 1
